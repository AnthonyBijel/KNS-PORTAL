<div class="request-contianer">
    <h1>Requests</h1>
    <p>Access the module and grade records you need</p>

    <div class="grid-container">
        <div>
            <div class="module-request-form">
                <h1>Request a Module</h1>
                <p>Choose your subjectand module below</p>
                <div class="year-course-sem">
                    <div class="course-contianer">                
                        <label for="course">Course</label>
                        <select id="Course" name="course">
                            <option value="1">BSCS</option>
                            <option value="2">BSED</option>
                            <option value="3">BSBA</option>
                            <option value="4">BSHM</option>
                            <option value="5">HRM</option>
                        </select>
                        
                    </div>
                    <div class="year-contianer">
                        <label for="year">Year</label>
                        <select id="year" name="course">
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                            <option value="3">3rd</option>
                            <option value="4">4th</option>
                        </select>
                    </div>
                    <div class="semester-contianer">
                        <label for="sem-box">Sem</label>
                        <select id="sem-box" name="sem-box">
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                        </select>
                    </div>
                </div>
                <div class="module-type-title">
                    <p>Subject</p>
                    <input type="text"
                        placeholder="">
                </div>
                <button>Request</button>
            </div>
            <div class="record-request-form">
                <h1>Request a GradeRecord</h1>
        
                <div class="year-course-sem-record">
                    <div class="course-contianer-record">                
                        <label for="course-record">Course</label>
                        <select id="Course-record" name="course-record">
                            <option value="1">BSCS</option>
                            <option value="2">BSED</option>
                            <option value="3">BSBA</option>
                            <option value="4">BSHM</option>
                            <option value="5">HRM</option>
                        </select>
                        
                    </div>
                    <div class="year-contianer-record">
                        <label for="year-record">Year</label>
                        <select id="year-record" name="course-record">
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                            <option value="3">3rd</option>
                            <option value="4">4th</option>
                        </select>
                    </div>
                    <div class="semester-contianer-record">
                        <label for="sem-box-record">Sem</label>
                        <select id="sem-box-record" name="sem-box-record">
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                        </select>
                    </div>
                </div>
                <button>Request</button>
            </div>
        </div>
        
        <div class="download-contianer">
            <h1>DOWNLOADS</h1>
            <section class="request-download-files">
               
                    <div class="module-file">
                        <img src="../asset/logo/open-book.png" alt="loading">
                        <div class="file-type">
                            <h1>Introduction to programming</h1>
                            <p> Module</p>
                        </div>
                        <button class="download-button">
                            <img src="..//asset/logo/download.svg">
                            <p>Download</p>
                        </button>
                    </div>
                    <div class="grade-file">
                        <img src="../asset/logo/failed.gif" alt="loading">
                        <div class="grade-type">
                            <h1>2nd sem 2025-2026</h1>
                            <p> GradeRecord</p>
                        </div>
                        <button class="download-button">
                            <img src="..//asset/logo/download.svg">
                            <p>Download</p>
                        </button>
                    </div>
                    
               
            </section>
        </div>
    </div>
   
</div>
