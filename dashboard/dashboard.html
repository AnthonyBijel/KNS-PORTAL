<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard.org</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
<!--HEADER CONTIANER-->

    <div class="header-main-contianer">
        <div class="header-left-box">
            <div class="sidebar-logo-box"><img class="sidebar-logo" src="../asset/logo/sidebar-flip.png"></div>
            <div class="left-text-box">
                <p class="top-left-header">Student services</p>
                <p class="bottom-left-header">My portal</p>
            </div>
            
            
        </div>
        <div class="header-right-box">
            <div class="bell-contianer">
                <img class="bell-logo"src="../asset/logo/bell-notification-social-media.png">
            </div>
            <div class="middle-text">
                <div class="initial-box"><P>AB</P></div>
            </div>
            <div class="last-tex-box">
                <p class="username-top">Anton Banda</p>
                <p class="course-bottom">BSCS Student</p>
            </div>
        </div>
    </div>
<!--SIDE-BAR-PANEL-->
    <div class="sidebar-contianer">
    </div>
<!--MAIN-CONTENT-CONTIANER-->
    <div class="main-content-contianer">
        <div class="greeting-contianer">
            <div class="welcome-text-box">
                <p class="date-layer">Wednesday, September 2</p>
                <h1 class="greet-layer">Good afternoon, Anton.</h1>
                <p class="request-review">Your latest result is ready, and Student Services is reviewing your module request.</p>
                
                <div class="result-request">
                    <div class="check-lates-result">
                        <img class="stats "src="../asset/logo/stats.png">
                        <p class="stat-text">Check latest results</p>
                    </div>
                    <div class="create-request">
                        <img class="stat" src="../asset/logo/add-document.png">
                        <p class="stat-text">Check latest results</p>
                    </div>
                </div>
                
            </div>
            <div class="GPA-box">
                <div class="GPA-container">
                        <p class="GPA-score">1.76</p>
                        <p  class="GPA-status">current GPA</p>
                </div>
            </div>

        </div>

    </div>
</body>
</html>
